plugins {
	id 'java'
	id 'org.springframework.boot' version "${springBootVersion}"
	id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
	id 'com.diffplug.spotless' version "${spotlessVersion}"
	id 'jacoco'
}

group = "${projectGroup}"
version = "${applicationVersion}"

java {
	sourceCompatibility = "${javaVersion}"
}

repositories {
	mavenCentral()
}

jar {
	enabled = false
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// database
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	//test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	testImplementation "org.testcontainers:mariadb:${testContainersVersion}"
	testImplementation "org.testcontainers:testcontainers:${testContainersVersion}"
	testImplementation "org.testcontainers:junit-jupiter:${testContainersVersion}"
	testImplementation "org.testcontainers:localstack:${testContainersVersion}"
	testImplementation "org.jeasy:easy-random-core:${easyRandomVersion}"


	// querydsl
	implementation 'com.querydsl:querydsl-jpa'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jpa"

	// s3
	implementation "io.awspring.cloud:spring-cloud-aws-s3:${s3Version}"


	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// jwt
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	//email
	implementation "software.amazon.awssdk:ses:${sesVersion}"
	implementation "com.sun.mail:javax.mail:${javaxMailVersion}"

	//Swagger
	implementation "org.springdoc:springdoc-openapi-ui:${swaggerVersion}"

	// OpenCsv
	implementation "com.opencsv:opencsv:${opencsvVersion}"

	// Quartz
	implementation "org.quartz-scheduler:quartz:${quartzVersion}"

	// Resilience4j
	implementation "io.github.resilience4j:resilience4j-spring-boot2:${resilience4jVersion}"
}

tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.named('test') {
	useJUnitPlatform()
}

def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [querydslDir]
}

tasks.withType(JavaCompile) {
	options.annotationProcessorGeneratedSourcesDirectory = file(querydslDir)
}

clean.doLast {
	file(querydslDir).deleteDir()
}

tasks.named('compileJava') {
	dependsOn 'spotlessApply'
}

spotless {
	java {
		// Google Java 포맷 적용
		/*
            googleJavaFormat() : 탭은 2개의 공백
            googleJavaFormat().aosp() : 탭은 4개의 공백
            [참고] https://github.com/google/google-java-format/issues/525
         */
		googleJavaFormat().aosp()
		// 아래 순서로 import문 정렬
		importOrder('java', 'javax', 'jakarta', 'org', 'com')
		// 사용하지 않는 import 제거
		removeUnusedImports()
		// 각 라인 끝에 있는 공백을 제거
		trimTrailingWhitespace()
		// 파일 끝에 새로운 라인 추가
		endWithNewline()
	}
}

jacoco {
	toolVersion = "0.8.8" // 버전 명시
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true

		finalizedBy 'jacocoTestCoverageVerification'
	}

	afterEvaluate {
		classDirectories.setFrom(
				files(classDirectories.files.collect{
					fileTree(dir: it, excludes: [
					        "**/ExceedApplication",
							"**/*Config*",
							"**/*Exception*",
							"**/*Filter*",
							"**/*Docs*",
							"**/*DTO*",
							"**/common/**",
							"**/health/**",
							"**/*Error*",
							"**/*Adapter*",
							"**/*Port*",
							"**/*Converter*",
							"**/Q*"
					])
				})
		)
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			enabled = false
			element = 'CLASS'

			// Instruction Coverage 20%
			limit {
				minimum = 0.20
			}

			// 커버리지 체크를 제외할 클래스들
			excludes = [
                    '*.ExceedApplication',
					'*.config.*',
					'*.common.*',
					'*.dto.*',
					'*.health.*',
					'*.infrastructure.*',
					'*.docs.*',
					'*.exception.*',
					'*.adapter.out.*',
					'*.application.port.in.*',
					'*.application.port.out.*',
					'*.security.*'
			]
		}
	}
}
